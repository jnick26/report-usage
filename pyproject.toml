[project]
name = "harness-usage"
version = "0.1.1"
description = "Local coding-agent usage accounting"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "markdown-it-py>=3,<5",
    "duckdb==1.5.5",
    "pyarrow==23.0.1",
]

[project.scripts]
harness-usage = "harness_usage.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.15", "httpx>=0.28", "pyinstaller>=6.12"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/harness_usage"]
